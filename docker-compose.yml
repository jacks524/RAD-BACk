services:
  rda-agent:
    build: .
    container_name: rda-agent
    env_file: .env
    depends_on:
      rda-db-corpus:
        condition: service_healthy
      rda-db-identite:
        condition: service_healthy
      rda-db-intelligence:
        condition: service_healthy
      rda-donnees:
        condition: service_started
      rda-inference:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ${KALATI_DATA:-./data}/artefacts:/app/artefacts:ro
    networks:
      - rda-app
      - rda-corpus
      - rda-identite
      - rda-intelligence
      - rda-donnees

  rda-inference:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: rda-inference
    command: ["-m", "/models/modele.gguf", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ${KALATI_DATA:-./data}/modeles:/models:ro
    networks:
      - rda-app

  rda-db-corpus:
    image: pgvector/pgvector:pg16
    container_name: rda-db-corpus
    environment:
      POSTGRES_DB: rda_corpus
      POSTGRES_USER: rda_corpus_admin
      POSTGRES_PASSWORD: rda_corpus_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rda_corpus_admin -d rda_corpus"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - vol-corpus:/var/lib/postgresql/data
    networks:
      - rda-corpus

  rda-db-identite:
    image: postgres:16
    container_name: rda-db-identite
    environment:
      POSTGRES_DB: rda_identite
      POSTGRES_USER: rda_identite_admin
      POSTGRES_PASSWORD: rda_identite_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rda_identite_admin -d rda_identite"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - vol-identite:/var/lib/postgresql/data
    networks:
      - rda-identite

  rda-db-intelligence:
    image: postgres:16
    container_name: rda-db-intelligence
    environment:
      POSTGRES_DB: rda_intelligence
      POSTGRES_USER: rda_intelligence_admin
      POSTGRES_PASSWORD: rda_intelligence_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rda_intelligence_admin -d rda_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - vol-intelligence:/var/lib/postgresql/data
    networks:
      - rda-intelligence

  rda-donnees:
    build:
      context: .
      dockerfile: Dockerfile.donnees
    container_name: rda-donnees
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "6379:6379"
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${KALATI_DATA:-./data}/redis:/data/redis
      - ${KALATI_DATA:-./data}/minio:/data/minio
    networks:
      - rda-donnees

  rda-front-admin:
    build:
      context: ../RAD-FRONT/kalati_admin
      dockerfile: Dockerfile
      args:
        KALATI_API_BASE_URL: http://localhost:8000/api/v1
    container_name: rda-front-admin
    ports:
      - "8080:80"
    networks:
      - rda-app

  rda-front-agent:
    build:
      context: ../RAD-FRONT/kalati_agent
      dockerfile: Dockerfile
      args:
        KALATI_API_BASE_URL: http://localhost:8000/api/v1
    container_name: rda-front-agent
    volumes:
      - ${KALATI_DATA:-./data}/builds-agent:/sorties
    networks:
      - rda-app

networks:
  rda-app:
  rda-corpus:
  rda-identite:
  rda-intelligence:
  rda-donnees:

volumes:
  vol-corpus:
  vol-identite:
  vol-intelligence:
