[project]
name = "rda-backend"
version = "0.1.0"
description = "Backend RAG critique pour la recherche documentaire augmentee CAMRAIL."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "bcrypt>=4.1",
  "fastapi>=0.111",
  "greenlet>=3.0",
  "httpx>=0.27",
  "minio>=7.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "passlib[bcrypt]>=1.7",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rda"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

